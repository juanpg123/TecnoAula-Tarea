<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a58ca"/>
      <stop offset="100%" stop-color="#3d8bfd"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="url(#logoGrad)" stroke-width="6"/>

  <!-- Monitor / Screen outline representing Tech Support & Web -->
  <rect x="52" y="55" width="96" height="64" rx="8" fill="none" stroke="url(#logoGrad)" stroke-width="6"/>
  <!-- Monitor base -->
  <path d="M 88 119 L 84 135 L 116 135 L 112 119" fill="url(#logoGrad)"/>
  <line x1="72" y1="135" x2="128" y2="135" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Code brackets inside monitor -->
  <path d="M 75 75 L 65 87 L 75 99" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 125 75 L 135 87 L 125 99" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Screwdriver / Wrench / Tech gear accent in the center -->
  <circle cx="100" cy="87" r="7" fill="url(#logoGrad)" stroke="#ffffff" stroke-width="3"/>

  <!-- TecnoAula monogram "TA" at bottom -->
  <text x="100" y="165" font-family="'Saira Extra Condensed', sans-serif" font-weight="700" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">TECNOAULA</text>
</svg>
